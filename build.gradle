plugins {
 id 'java-library'
 id 'maven-publish'
 id 'idea'
 id 'net.minecraftforge.gradle' version '[6.0,6.2)'
 id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
version = "${mod_version}-forge-mc${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
 mappings channel: 'official', version: minecraft_version
 accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
 runs {
  configureEach {
   workingDirectory project.file('build/forge-1201-server')
   property 'forge.enabledGameTestNamespaces', mod_id
   mods { floraexpansion { source sourceSets.main } }
  }
  client { workingDirectory project.file('build/forge-1201-client') }
  server { args '--nogui' }
  gameTestServer { workingDirectory project.file('build/forge-1201-gametest') }
  data { workingDirectory project.file('build/forge-1201-data'); args '--mod', mod_id, '--all', '--output', file('src/generated/resources'), '--existing', file('src/main/resources') }
 }
}
repositories {
 maven { url = 'https://maven.blamejared.com/' }
 maven { url = 'https://maven.ryanliptak.com/' }
}
dependencies {
 minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
 annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
 compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
 compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
 if (!providers.gradleProperty('withoutOptionalMods').isPresent()) {
  runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
  runtimeOnly fg.deobf("squeek.appleskin:appleskin-forge:${appleskin_version}")
 }
}
mixin { add sourceSets.main, 'main.refmap.json'; config 'floraexpansion.mixins.json' }
// MixinGradle writes these outside the classes directory. Include them in
// Gradle's cached outputs so a restored compilation also restores its mappings.
def mixinRefmap = layout.buildDirectory.file('tmp/compileJava/main.refmap.json')
tasks.named('compileJava', JavaCompile) {
 options.incremental = false
 outputs.files(mixinRefmap,
         layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'),
         layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg'))
}
sourceSets.main.resources { srcDir 'src/generated/resources'; exclude '.cache/**' }
tasks.named('processResources', ProcessResources) {
 def props = project.properties.findAll { k, v -> k.startsWith('mod_') || k.endsWith('_version_range') || k == 'minecraft_version' }
 inputs.properties props
 filesMatching('META-INF/mods.toml') { expand props }
}
tasks.named('jar', Jar) {
 doFirst {
  def refmap = mixinRefmap.get().asFile
  if (!refmap.isFile() || !new groovy.json.JsonSlurper().parse(refmap).mappings) {
   throw new GradleException('Mixin reference map is missing or empty; refusing to package an unusable mod.')
  }
 }
 exclude '**/ForgePortTests*', 'data/floraexpansion/structures/empty.nbt'
 from('LICENSE')
 manifest { attributes('MixinConfigs': 'floraexpansion.mixins.json') }
 finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '1000'] }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }

if (providers.gradleProperty('forgeTests').isPresent() || providers.gradleProperty('portTests').isPresent()) {
 sourceSets.main.java.srcDir 'src/forgeTest/java'
 sourceSets.main.resources.srcDir 'src/forgeTest/resources'
}
