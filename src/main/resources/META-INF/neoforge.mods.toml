modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/flora-expansion"
issueTrackerURL="https://github.com/IntelligenceModding/FloraExpansion/issues"
bannerFile="banner.png"
iconFile="icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
